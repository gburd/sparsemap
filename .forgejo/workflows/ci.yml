name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Codeberg's hosted Forgejo Actions runners advertise three label
# tiers: codeberg-tiny (1 CPU / 2G / 2 min), codeberg-small (2 / 4G /
# 5 min), codeberg-medium (4 / 8G / 10 min).
#
# We don't pin a `container:` -- Codeberg's runner uses
# ghcr.io/catthehacker/ubuntu:act-latest by default, which is
# GitHub-Actions-compatible and already has most build tools
# preinstalled.

jobs:
  build:
    runs-on: codeberg-medium
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }} meson ninja-build \
                                  pkg-config valgrind

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup meson
        env:
          CC: ${{ matrix.compiler }}
        run: meson setup builddir

      - name: Build
        run: ninja -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

  # Cross-architecture builds via qemu-user-static.  Verifies that
  # sparsemap's serialization, alignment, and shift logic actually
  # work on the other ISAs we claim to support.  These take ~5x
  # longer than native runs (qemu emulation overhead) but catch
  # bugs that x86-only CI would miss.
  cross-arch:
    runs-on: codeberg-medium
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            triplet: aarch64-linux-gnu
            qemu: qemu-aarch64-static
          - arch: riscv64
            triplet: riscv64-linux-gnu
            qemu: qemu-riscv64-static
          - arch: s390x          # big-endian
            triplet: s390x-linux-gnu
            qemu: qemu-s390x-static
    steps:
      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              gcc-${{ matrix.triplet }} \
              meson ninja-build pkg-config \
              qemu-user-static binfmt-support

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Write meson cross file
        run: |
          mkdir -p .ci
          cat > .ci/cross-${{ matrix.arch }}.ini <<EOF
          [binaries]
          c = '${{ matrix.triplet }}-gcc'
          ar = '${{ matrix.triplet }}-ar'
          strip = '${{ matrix.triplet }}-strip'
          exe_wrapper = '${{ matrix.qemu }}'

          [host_machine]
          system = 'linux'
          cpu_family = '${{ matrix.arch }}'
          cpu = '${{ matrix.arch }}'
          endian = '$( [ "${{ matrix.arch }}" = "s390x" ] && echo big || echo little )'
          EOF

      - name: Setup meson (cross)
        run: meson setup builddir --cross-file .ci/cross-${{ matrix.arch }}.ini

      - name: Build
        run: ninja -C builddir

      - name: Test (under qemu)
        run: meson test -C builddir --print-errorlogs --timeout-multiplier 5

  sanitizers:
    runs-on: codeberg-medium
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
        # Skip 'thread' until experiment/thread-safe lands; the
        # current single-threaded library is TSan-clean by
        # construction but the test harness uses pthreads only in
        # soak (which is build_by_default=false).
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc meson ninja-build pkg-config

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup meson with ${{ matrix.sanitizer }} sanitizer
        run: |
          meson setup builddir-${{ matrix.sanitizer }} \
            -Db_sanitize=${{ matrix.sanitizer }} \
            -Ddiagnostic=true

      - name: Build
        run: ninja -C builddir-${{ matrix.sanitizer }}

      - name: Test
        run: meson test -C builddir-${{ matrix.sanitizer }} --print-errorlogs

  valgrind:
    runs-on: codeberg-medium
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc meson ninja-build pkg-config valgrind

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build
        run: |
          meson setup builddir -Ddiagnostic=true
          ninja -C builddir

      - name: Valgrind check
        run: scripts/check_memory.sh builddir

  # Keep the version string aligned across meson.build and
  # include/sparsemap.h.  Fails loudly if a bump forgets one of them.
  version-consistency:
    runs-on: codeberg-medium
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Check all version sources agree
        run: scripts/check_version_consistency.sh

      - name: Check chunk_vector_size_table in sync with generator
        run: scripts/check_chunk_vector_size_table.sh

  # libFuzzer harness for the deserialize path.  Runs for 60 seconds
  # on every push; longer runs (campaigns) happen on a schedule
  # outside of CI.  A crash short-circuits the build and posts the
  # reproducer as an artifact.
  fuzz:
    runs-on: codeberg-medium
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang meson ninja-build pkg-config

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup meson with libFuzzer
        env:
          CC: clang
        run: meson setup builddir-fuzz -Dfuzz=enabled

      - name: Build
        run: ninja -C builddir-fuzz

      - name: Smoke fuzz (60s)
        run: |
          mkdir -p tests/fuzz-corpus  # corpus is committed; ensure dir exists
          builddir-fuzz/tests/fuzz_deserialize tests/fuzz-corpus \
              -max_total_time=60 -print_final_stats=1
