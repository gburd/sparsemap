name: rust

on:
  push:
    branches: [ports/rust]
  pull_request:
    branches: [ports/rust]

defaults:
  run:
    working-directory: rust

jobs:
  test:
    runs-on: codeberg-medium
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (default features, incl. C wire-compat FFI)
        run: cargo test
      - name: Doc
        run: cargo doc --no-deps

  no_std:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build without default features (no_std)
        run: cargo build --no-default-features

  wire-compat:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: C reads Rust-produced buffers
        run: sh ci/wire_compat.sh

  msrv:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: |
          rustup toolchain install 1.77 --profile minimal
          rustup default 1.77
      - name: Build at MSRV
        run: SPARSEMAP_NO_C_FFI=1 cargo build
