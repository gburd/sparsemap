name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc, clang]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config valgrind
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Setup meson
        env:
          CC: ${{ matrix.compiler }}
        run: meson setup builddir

      - name: Build
        run: ninja -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config

      - name: Build with ${{ matrix.sanitizer }} sanitizer
        run: |
          meson setup builddir-${{ matrix.sanitizer }} \
            -Db_sanitize=${{ matrix.sanitizer }} \
            -Ddiagnostic=true
          ninja -C builddir-${{ matrix.sanitizer }}

      - name: Test
        run: meson test -C builddir-${{ matrix.sanitizer }} --print-errorlogs

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config valgrind

      - name: Build
        run: |
          meson setup builddir -Ddiagnostic=true
          ninja -C builddir

      - name: Valgrind check
        run: scripts/check_memory.sh builddir

  # Cross-architecture builds via qemu-user-static.
  cross-arch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            triplet: aarch64-linux-gnu
            qemu: qemu-aarch64-static
            endian: little
          - arch: riscv64
            triplet: riscv64-linux-gnu
            qemu: qemu-riscv64-static
            endian: little
          - arch: s390x
            triplet: s390x-linux-gnu
            qemu: qemu-s390x-static
            endian: big
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain + qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              gcc-${{ matrix.triplet }} \
              meson ninja-build pkg-config \
              qemu-user-static binfmt-support

      - name: Write meson cross file
        run: |
          mkdir -p .ci
          cat > .ci/cross-${{ matrix.arch }}.ini <<EOF
          [binaries]
          c = '${{ matrix.triplet }}-gcc'
          ar = '${{ matrix.triplet }}-ar'
          strip = '${{ matrix.triplet }}-strip'
          exe_wrapper = '${{ matrix.qemu }}'

          [host_machine]
          system = 'linux'
          cpu_family = '${{ matrix.arch }}'
          cpu = '${{ matrix.arch }}'
          endian = '${{ matrix.endian }}'
          EOF

      - name: Setup meson (cross)
        run: meson setup builddir --cross-file .ci/cross-${{ matrix.arch }}.ini

      - name: Build
        run: ninja -C builddir

      - name: Test (under qemu)
        run: meson test -C builddir --print-errorlogs --timeout-multiplier 5

  # 32-bit (ILP32) build: catches size_t-truncation bugs that LP64 hosts
  # cannot see.  i686 runs natively on the x86-64 runner (no qemu), via
  # gcc -m32 + multilib.
  ilp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib meson ninja-build pkg-config
      - name: Write meson ILP32 cross file
        run: |
          mkdir -p .ci
          cat > .ci/ilp32.ini <<EOF
          [binaries]
          c = ['gcc', '-m32']
          ar = 'ar'
          strip = 'strip'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF
      - name: Setup meson (ILP32)
        run: meson setup builddir-ilp32 --cross-file .ci/ilp32.ini
      - name: Build
        run: ninja -C builddir-ilp32
      - name: Test
        run: meson test -C builddir-ilp32 --print-errorlogs

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all version sources agree
        run: scripts/check_version_consistency.sh
      - name: Check chunk_vector_size_table in sync with generator
        run: scripts/check_chunk_vector_size_table.sh
      - name: Check sources are ASCII-only
        run: scripts/check_ascii.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang meson ninja-build pkg-config
      - name: Setup meson with libFuzzer
        env:
          CC: clang
        run: meson setup builddir-fuzz -Dfuzz=enabled
      - name: Build
        run: ninja -C builddir-fuzz
      - name: Smoke fuzz (60s)
        run: |
          builddir-fuzz/tests/fuzz_deserialize tests/fuzz-corpus \
              -max_total_time=60 -print_final_stats=1

  # Property-based tests against the official Hegel C library
  # (hegeldev/hegel-rust hegel-c): an in-process FFI, so we just need
  # the prebuilt libhegel plus the tagged header.  Pinned to the same
  # release flake.nix uses so CI and the dev shell agree.
  hegel:
    runs-on: ubuntu-latest
    env:
      HEGEL_VERSION: v0.30.3
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc meson ninja-build pkg-config curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official libhegel + header
        run: |
          mkdir -p .hegel/include .hegel/lib
          curl -sSfL -o .hegel/include/hegel.h \
            "https://raw.githubusercontent.com/hegeldev/hegel-rust/${HEGEL_VERSION}/hegel-c/include/hegel.h"
          curl -sSfL -o .hegel/lib/libhegel.so \
            "https://github.com/hegeldev/hegel-rust/releases/download/${HEGEL_VERSION}/libhegel-linux-amd64.so"

      - name: Setup meson with hegel enabled
        run: |
          export CPATH="$PWD/.hegel/include:${CPATH:-}"
          export LIBRARY_PATH="$PWD/.hegel/lib:${LIBRARY_PATH:-}"
          meson setup builddir-hegel -Dhegel=enabled

      - name: Build
        run: ninja -C builddir-hegel

      - name: Run property tests
        run: |
          export LD_LIBRARY_PATH="$PWD/.hegel/lib:${LD_LIBRARY_PATH:-}"
          meson test -C builddir-hegel hegel hegel_white --print-errorlogs
